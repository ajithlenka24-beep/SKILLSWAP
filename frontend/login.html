<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | SkillSwap</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page" data-page="login">
<a class="brand auth-brand" href="index.html">Skill<span>Swap</span></a>
<main class="auth-card">
  <span class="eyebrow">WELCOME BACK</span>
  <h1>Log in to SkillSwap</h1>
  <p class="muted">Continue your learning journey.</p>
  <form id="loginForm">
    <label for="email">Email</label><input type="email" id="email" required autocomplete="email" placeholder="you@example.com">
    <label for="password">Password</label><input type="password" id="password" required autocomplete="current-password" placeholder="Your password">
    <button class="btn full" type="submit">Login</button>
    <p id="message" class="form-message"></p>
  </form>
  <p class="auth-switch">New to SkillSwap? <a href="register.html">Create an account</a></p>
</main>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
