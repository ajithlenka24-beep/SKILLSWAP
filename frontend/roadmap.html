<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Roadmap | SkillSwap</title>
  <meta name="description" content="SkillSwap – exchange skills with fellow students.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="roadmap">
<header class="topbar appbar" id="appHeader"></header>
<main class="app-main narrow">
  <span class="eyebrow">GEMINI AI ASSISTANT</span>
  <h1>Create your learning roadmap</h1>
  <p class="muted">Tell AI what you want to learn. It will create a practical four-week plan.</p>
  <section class="panel">
    <form id="roadmapForm">
      <label for="topic">Skill or topic</label><input id="topic" required maxlength="120" placeholder="e.g. JavaScript">
      <label for="level">Current level</label><select id="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select>
      <label for="goal">Your goal</label><textarea id="goal" rows="3" maxlength="500" placeholder="e.g. Build a personal portfolio website"></textarea>
      <button class="btn" type="submit" id="roadmapBtn">Generate roadmap</button>
    </form>
    <div id="roadmapResult" class="roadmap-result"></div>
    <div class="row-actions" id="roadmapActions" hidden>
      <button class="btn btn-outline" id="copyRoadmap" type="button">Copy roadmap</button>
      <button class="btn btn-outline" id="printRoadmap" type="button">Print / save as PDF</button>
    </div>
  </section>
</main>
<script src="js/api.js"></script>
<script src="js/roadmap.js"></script>
</body>
</html>
